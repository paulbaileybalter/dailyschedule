<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul’s Dashboard — Balter Brewing</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#47D7AC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bubbles" aria-hidden="true"></div>
<header id="top">
  <div class="header-in">
    <div class="hleft"><div class="logo" aria-hidden="true">
      <svg viewBox="0 0 161 161"><path fill="#47D7AC" d="M136.3,70.4l-9.4-9.4c-1.6-1.6-4.3-1.6-6,0-1.6,1.6-1.6,4.3,0,6l2.3,2.3c-9.6,13.2-25.2,21.7-42.7,21.7s-33.1-8.6-42.7-21.8l2.3-2.3c1.6-1.6,1.6-4.3,0-6-1.6-1.6-4.3-1.6-6,0l-9.4,9.4c-1.6,1.6-1.6,4.3,0,6,.8.8,1.9,1.2,3,1.2s2.2-.4,3-1.2l1.1-1.1c11.2,14.7,28.9,24.2,48.7,24.2s37.5-9.5,48.7-24.2l1.1,1.1c.8.8,1.9,1.2,3,1.2s2.2-.4,3-1.2c1.6-1.6,1.6-4.3,0-6"/><path fill="#47D7AC" d="M152.5,8.5v144H8.5V8.5h144M161,0H0v161h161V0h0Z"/></svg>
    </div>
    <div class="brand">
      <span class="kicker">Balter Brewing</span>
      <h1>Paul’s Dashboard</h1>
    </div></div>
    <div class="now" id="now" aria-live="off"><span class="nowdate" id="nowDate"></span><span class="wx" id="wx" hidden></span></div>
    <div class="hright"><nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-act="view" data-view="day">Day</button>
      <button class="tab" role="tab" data-act="view" data-view="week">Week</button>
      <button class="tab" role="tab" data-act="view" data-view="history">History</button>
    </nav>
    <div class="actions">
      <span class="sync" id="sync" data-state="saved" aria-live="polite"><i></i><span id="syncTxt">Saved</span></span>
      <button class="btn ghost icon" id="settingsBtn" data-act="settings" aria-label="Settings" title="Settings"></button>
    </div></div>
  </div>
</header>
<div class="page" id="page"><main id="app"></main></div>
<div id="menu" class="popover" hidden></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
